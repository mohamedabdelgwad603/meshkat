name: mishkat
description: "مِشكاة — Quran reader with tafsir and recitations."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Networking & storage
  dio: ^5.8.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5

  # UI
  flutter_screenutil: ^5.9.3
  skeletonizer: ^2.1.0
  easy_localization: ^3.0.7
  share_plus: '>=11.0.0 <14.0.0'

  # Audio
  just_audio: ^0.10.4
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  pretty_dio_logger: ^1.4.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  firebase_core: ^5.1.0
  firebase_remote_config: ^7.0.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0F3D2E"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/quran/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs-v18.ttf
